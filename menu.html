<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d60000">
<title>鹽酥雞點餐計算機</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#222;--muted:#777;--red:#d60000;--line:#e3e3e3;--btn:#eee;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161616;--card:#262626;--text:#f1f1f1;--muted:#aaa;--line:#3a3a3a;--btn:#383838;}}
:root[data-theme="dark"]{--bg:#161616;--card:#262626;--text:#f1f1f1;--muted:#aaa;--line:#3a3a3a;--btn:#383838;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text);
 padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));touch-action:manipulation;}
header{background:var(--red);color:#fff;text-align:center;padding:12px;font-size:22px;font-weight:bold;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;}
.hint{text-align:center;color:var(--muted);font-size:15px;padding:8px 10px 0;}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;}
.product{position:relative;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:19px;font-weight:bold;min-height:84px;line-height:1.4;}
.product:active{background:var(--btn);}
.product small{display:block;color:var(--red);font-size:17px;}
.badge{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font-size:15px;line-height:26px;padding:0 6px;display:none;}
.cart{background:var(--card);margin:0 10px 10px;border-radius:12px;padding:10px 12px;}
.cart h2{margin:0 0 4px;font-size:18px;color:var(--muted);}
.empty{color:var(--muted);padding:8px 0;}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:19px;gap:8px;}
.sub{color:var(--muted);font-size:15px;}
.ops{display:flex;gap:6px;flex-shrink:0;}
.qty-btn{font-size:22px;width:44px;height:44px;border:none;border-radius:10px;background:var(--btn);color:var(--text);}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;}
.total{flex:1;font-size:30px;font-weight:bold;color:var(--red);text-align:center;}
.clear{font-size:20px;font-weight:bold;border:none;border-radius:10px;background:var(--btn);color:var(--text);padding:14px 18px;}
.note{text-align:center;color:var(--muted);font-size:13px;padding:0 10px 10px;}
</style>
</head>
<body>
<header>🍗 鹽酥雞點餐計算機</header>
<div class="hint">點品項加入，算算看要多少錢（價格以現場為準）</div>
<div class="products" id="products"></div>
<div class="cart"><h2>我的餐點</h2><div id="cart"></div></div>
<div class="note">此頁僅供試算，不會送出訂單，請到櫃檯點餐結帳</div>
<div class="bar"><div class="total" id="total">總計：0 元</div><button class="clear" onclick="clearCart()">清空</button></div>
<script>
const products=[
{name:"鹽酥雞",price:60},{name:"魷魚",price:60},{name:"地瓜條",price:40},
{name:"雞皮",price:40},{name:"四季豆",price:40},{name:"玉米",price:45},
{name:"雞屁股",price:30},{name:"雞心",price:30},{name:"雞胗",price:30},
{name:"花枝丸",price:30},{name:"甜不辣",price:25},{name:"豬血糕",price:20},
{name:"豆乾",price:20},{name:"芋頭籤",price:20},{name:"芋頭巧",price:20},
{name:"百葉豆腐",price:20},{name:"魚板",price:20},{name:"豆包",price:20},
{name:"雞脖子",price:20}
];
let cart={};
const badges={};
const pd=document.getElementById("products");
products.forEach(p=>{
  const b=document.createElement("button");
  b.className="product";
  b.innerHTML=`${p.name}<small>$${p.price}</small><span class="badge"></span>`;
  b.onclick=()=>{cart[p.name]=(cart[p.name]||0)+1;render();};
  badges[p.name]=b.querySelector(".badge");
  pd.appendChild(b);
});
function render(){
  const box=document.getElementById("cart");
  box.innerHTML="";
  let total=0;
  const names=Object.keys(cart);
  if(!names.length)box.innerHTML='<div class="empty">還沒有選品項</div>';
  names.forEach(n=>{
    const p=products.find(x=>x.name===n);
    const q=cart[n];total+=p.price*q;
    const row=document.createElement("div");
    row.className="cart-item";
    row.innerHTML=`<span>${n} x ${q}<div class="sub">$${p.price*q}</div></span><div class="ops"><button class="qty-btn">-</button><button class="qty-btn">+</button></div>`;
    const bt=row.querySelectorAll("button");
    bt[0].onclick=()=>{cart[n]--;if(cart[n]<=0)delete cart[n];render();};
    bt[1].onclick=()=>{cart[n]++;render();};
    box.appendChild(row);
  });
  products.forEach(p=>{const e=badges[p.name];const q=cart[p.name]||0;e.style.display=q?"block":"none";e.textContent=q;});
  document.getElementById("total").textContent="總計："+total+" 元";
}
function clearCart(){cart={};render();}
render();
</script>
</body>
</html>
