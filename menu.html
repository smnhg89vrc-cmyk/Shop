<style>
:root{
  --hero:#B3241A;
  --bg:#FFFBF2; --card:#FFFFFF; --ink:#211A16; --muted:#6B5E55; --line:#E8DDCB;
  --accent:#B3241A; --btn:#B3241A; --tint:rgba(244,178,35,.20);
  --gold:#F4B223; --bar-ink:#211A16;
  --ok:#14532D; --over:#8E1A12;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17120F; --card:#231C18; --ink:#FBF1E0; --muted:#BDAE9E; --line:#3A2F28;
    --accent:#FF8F78; --btn:#D9352A; --tint:rgba(244,178,35,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#17120F; --card:#231C18; --ink:#FBF1E0; --muted:#BDAE9E; --line:#3A2F28;
  --accent:#FF8F78; --btn:#D9352A; --tint:rgba(244,178,35,.16);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--hero);scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.5;padding-bottom:240px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900}

/* hero */
.hero{background:var(--hero);color:#fff;padding:30px 0 44px}
.hero h1{margin:0;font-size:38px;line-height:1.15;letter-spacing:.03em}
.calc-name{margin-top:14px;font-size:30px;line-height:1.2;letter-spacing:.2em}
.stamp{
  display:inline-block;margin-top:12px;padding:4px 16px 5px;
  background:var(--gold);color:#211A16;font-size:24px;letter-spacing:.12em;
  border-radius:4px;transform:rotate(-2deg);
}
.lead{margin:16px 0 0;font-size:17px;max-width:22em}

/* budget card */
.budget{
  margin:-26px 0 8px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;
}
.budget label{display:block;font-weight:700;margin-bottom:8px}
.field{display:flex;align-items:center;gap:8px}
.field span{font-weight:700;color:var(--muted)}
.field input{
  flex:1;min-width:0;height:52px;font:inherit;font-size:22px;font-weight:700;
  padding:0 14px;border:2px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);
}
.field input:focus-visible{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  min-height:44px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer;
  background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:999px;
}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible,.step button:focus-visible,.bar button:focus-visible,.bar .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* menu */
h2{margin:28px 0 4px;font-size:23px;letter-spacing:.04em;padding-bottom:6px;border-bottom:3px double var(--line)}
.row{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
  padding:10px 8px;border-bottom:1px solid var(--line);border-radius:8px;
}
.row.on{background:var(--tint)}
.name{font-size:18px;font-weight:700}
.price{font-size:15px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{
  width:44px;height:44px;border-radius:50%;font:inherit;font-size:26px;line-height:1;font-weight:700;
  cursor:pointer;display:grid;place-items:center;padding:0;
}
.step .minus{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.step .plus{background:var(--btn);color:#fff;border:2px solid var(--btn)}
.step button:disabled{opacity:.3;cursor:default}
.qty{min-width:30px;text-align:center;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

/* summary */
.summary{margin-top:32px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.summary h2{margin-top:0}
.summary ul{list-style:none;margin:0;padding:0}
.summary li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.summary li.sum{font-weight:700;font-size:19px;border-bottom:0}
.empty{color:var(--muted);margin:8px 0 0}
.hours{display:inline-block;margin:14px 0 0;padding:6px 16px;font-weight:700;border:2px solid var(--gold);border-radius:999px}
.social{margin:28px 0 0;padding:18px 16px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px}
.social h2{margin:0;font-size:20px;color:var(--accent)}
.social .hrs{margin:4px 0 0;font-size:24px;font-weight:900}
.social .follow{margin:16px 0 8px;font-weight:700;color:var(--muted)}
.social .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.social a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;font-weight:900;text-decoration:none;
  background:var(--btn);color:#fff;border-radius:12px}
.social a[hidden]{display:none}
.social a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.note{margin:20px 0 0;font-size:14px;color:var(--muted)}

/* cheer + suggestions */
.cheer{font-size:15px;font-weight:700;line-height:1.35;margin:0 0 8px;min-height:20px}
.sugg-title{margin:16px 0 8px;font-weight:700}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{min-height:44px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--tint);color:var(--ink);border:2px solid var(--gold);border-radius:999px}
.sugg button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* celebration */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;display:none}
#pop{position:fixed;left:50%;top:32%;z-index:21;transform:translate(-50%,-50%) scale(.8);
  background:var(--gold);color:#211A16;font-size:28px;font-weight:900;line-height:1.3;text-align:center;width:max-content;max-width:86vw;
  padding:14px 24px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#pop small{display:block;margin-top:4px;font-size:18px;font-weight:700}
#pop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* bottom bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--gold);color:var(--bar-ink);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -3px 0 rgba(33,26,22,.18);
}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .lbl{font-size:14px;font-weight:700;display:block;line-height:1.2}
.bar #total{font-size:30px;line-height:1.1;display:block}
.bar-btns{display:flex;gap:8px}
.bar button,.bar .btn{
  min-height:44px;padding:0 16px;font:inherit;font-weight:700;border-radius:10px;cursor:pointer;
  display:inline-flex;align-items:center;text-decoration:none;
}
.bar button{background:transparent;color:var(--bar-ink);border:2px solid var(--bar-ink)}
.bar .btn{background:var(--bar-ink);color:var(--gold);border:2px solid var(--bar-ink)}
.track{height:8px;border-radius:99px;background:rgba(33,26,22,.2);margin:10px 0 6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--bar-ink);border-radius:99px}
.track.over i{background:var(--over)}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .2s ease}}
#status{margin:0;font-size:16px;font-weight:700}
#status.ok{color:var(--ok)}
#status.over{color:var(--over)}
.row.soldout{opacity:.5}
.row.soldout .name{text-decoration:line-through}

/* 電子支付 */
.paysec{margin-top:28px}
.paysec .pay-lead{margin:6px 0 12px;color:var(--muted);font-size:15px}
.paysec .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paysec .po{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:112px;margin:0;padding:10px 6px;font:inherit;text-align:center;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;cursor:pointer}
.paysec .po.sel{border-color:var(--btn);background:var(--tint)}
.paysec .po:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.paysec .pimg{display:block;width:100%;max-width:140px;height:62px;object-fit:contain;border-radius:8px;background:#fff}
.paysec .pico{display:flex;align-items:center;justify-content:center;width:100%;height:62px;font-size:46px;line-height:1}
.paysec .pt{font-size:21px;font-weight:900;line-height:1.2}
.paysec .ps{font-size:15px;font-weight:700;color:var(--muted);line-height:1.3}
.paysec .po.sel .ps,.paysec .po.sel .pt{color:var(--accent)}
.payc{margin:14px 0 0;padding:12px;border:2px solid var(--gold);border-radius:12px;text-align:center;background:var(--card)}
.payc[hidden]{display:none}
.payc h3{margin:0 0 4px;font-size:19px}
.payc .amt{margin:4px 0 8px;font-size:26px;font-weight:900;color:var(--accent)}
.payc .hint{margin:8px 0;color:var(--muted);font-size:14px}
.payc .qrimg{display:block;width:min(100%,260px);height:auto;margin:8px auto;background:#fff;padding:6px;border-radius:8px}
.payc .steps{margin:8px 0;padding-left:22px;text-align:left;font-size:15px}
.payc .paybtn,.payc button{display:block;width:100%;min-height:50px;margin-top:10px;font:inherit;font-size:18px;font-weight:900;text-align:center;line-height:50px;text-decoration:none;cursor:pointer;border-radius:12px}
.payc .paybtn{background:#06C755;color:#0b1f12;border:0}
.payc button{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:16px;font-weight:700;line-height:normal}
</style>
</head>

<div id="pop" role="status" aria-live="polite"></div>

<header class="hero">
  <div class="wrap">
    <h1 class="serif">台灣第一家鹽酥雞</h1>

    <div class="calc-name serif">餐點計算機</div>

      <button class="chip" type="button" data-v="500">500</button>
      <button class="chip" type="button" data-v="800">800</button>

function count() {
  return ALL.reduce(function (s, i) { return s + (qty[i.id] || 0); }, 0);

function suggestions(t) {
  var limit = budget ? budget - t : 40;
  return ALL.filter(function (i) {
    return (qty[i.id] || 0) === 0 && i.price <= limit && !soldOut[i.name];
  }).sort(function (a, b) { return b.price - a.price; }).slice(0, 3);
}
function renderExtras(t) {
  var n = count();
  var cheer = document.getElementById("cheer");
  var sug = document.getElementById("suggest");
  var over = budget && t > budget;
  var picks = n > 0 && !over ? suggestions(t) : [];

  var msg;
  if (n === 0) {
    msg = "🍗 歡迎光臨！從最愛的開始點吧";
  } else if (over) {
    msg = "💬 超出預算一點點，減一份也很剛好";
  } else {
    var ti = 0;
    TIERS.forEach(function (x, k) { if (t >= x.min) ti = k; });
    var cur = TIERS[ti], next = TIERS[ti + 1];
    msg = cur.emoji + " 已點 " + n + " 份・" + cur.name + "！";
    if (budget && picks.length) {
      msg += "還有 " + money(budget - t) + "，加一份「" + picks[0].name + "」剛剛好";
    } else if (budget) {
      msg += t === budget ? "剛好用完預算，完美 🎯" : "預算快用完了，剛剛好 👍";
    } else if (next) {
      msg += "再 " + money(next.min - t) + " 升級「" + next.name + "」";
    } else {
      msg += "太豪邁了，今天吃得超滿足 😄";
    }
  }
  cheer.textContent = msg;

  if (picks.length) {
    var h = '<p class="sugg-title">💡 想再多吃一點？點一下就加一份</p><div class="sugg">';
    picks.forEach(function (i) {
      h += '<button type="button" data-add="' + i.id + '">+ ' + i.name + " " + money(i.price) + "</button>";
    });
    sug.innerHTML = h + "</div>";
  } else {
    sug.innerHTML = "";
  }
}

var prevT = 0;
var fxRun = 0;
var popTimer = null;

function showPop(m) {
  var pop = document.getElementById("pop");
  pop.innerHTML = m.title + "<small>" + m.text + "</small>";
  pop.classList.add("show");
  clearTimeout(popTimer);
  popTimer = setTimeout(function () { pop.classList.remove("show"); }, 3400);
}

function celebrate(idx) {
  var m = MILESTONES[idx];
  showPop(m);
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = document.getElementById("fx");
  var ctx = c.getContext("2d");
  if (!ctx) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = window.innerWidth, H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  c.style.display = "block";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var colors = ["#F4B223", "#FF5A3C", "#FFFFFF", "#FFD76A", "#FF8F78", "#7DE0A1"];
  var total = 5 + idx * 2;          /* 越高的里程，煙火越多 */
  var per = 48 + idx * 6;
  var parts = [], bursts = 0, start = null;
  var id = ++fxRun;

  function burst() {
    var x = W * (0.12 + Math.random() * 0.76);
    var y = H * (0.10 + Math.random() * 0.45);
    var col = colors[Math.floor(Math.random() * colors.length)];
    for (var k = 0; k < per; k++) {
      var a = Math.PI * 2 * k / per, sp = 2 + Math.random() * 3.8;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col: col });
    }
  }
  function frame(ts) {
    if (id !== fxRun) return;
    if (start === null) start = ts;
    var el = ts - start;
    if (bursts < total && el > bursts * 300) { burst(); bursts++; }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.985; p.life -= 0.014;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2); ctx.fill();
    });
    if ((bursts < total || parts.length) && el < 9000) {
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, W, H);
      c.style.display = "none";
    }
  }
  requestAnimationFrame(frame);
}

function update() {
  var t = total();
  renderExtras(t);
  var hit = -1;
  MILESTONES.forEach(function (m, k) { if (prevT < m.at && t >= m.at) hit = k; });
  if (hit >= 0) celebrate(hit);
  prevT = t;
  ALL.forEach(function (i) {
    var q = qty[i.id] || 0;
    document.getElementById("qty-" + i.id).textContent = q;
    var row = document.getElementById("row-" + i.id);
    row.classList.toggle("on", q > 0);
    row.querySelector(".minus").disabled = q === 0;
    var out = !!soldOut[i.name];
    row.classList.toggle("soldout", out);
    row.querySelector(".price").textContent = out ? "已售完" : money(i.price) + "／" + i.unit;
    row.querySelector(".plus").disabled = out || q >= MAX_QTY;
  });

  document.getElementById("total").textContent = money(t);

  var status = document.getElementById("status");
  var track = document.getElementById("track");
  var fill = document.getElementById("fill");
  if (!budget) {
    status.textContent = "輸入上方預算，就會顯示還能點多少";
    status.className = "";
    track.classList.remove("over");
    fill.style.width = "0%";
  } else if (t <= budget) {
    status.textContent = "預算還剩 " + money(budget - t);
    status.className = "ok";
    track.classList.remove("over");
    fill.style.width = Math.min(t / budget, 1) * 100 + "%";
  } else {
    status.textContent = "超出預算 " + money(t - budget);
    status.className = "over";
    track.classList.add("over");
    fill.style.width = "100%";
  }

  var lines = "";
  var any = false;
  ALL.forEach(function (i) {
    var q = qty[i.id] || 0;
    if (q > 0) {
      any = true;
      lines += "<li><span>" + i.name + " × " + q + "</span><span>" + money(q * i.price) + "</span></li>";
    }
  });
  var box = document.getElementById("lines");
  if (!any) {
    box.innerHTML = '<p class="empty">還沒點任何東西。按品項右邊的 + 開始。</p>';
  } else {
    lines += '<li class="sum"><span>合計</span><span>' + money(t) + "</span></li>";
    if (budget) {
      lines += "<li><span>" + (t <= budget ? "預算還剩" : "超出預算") + "</span><span>" + money(Math.abs(budget - t)) + "</span></li>";
    }
    box.innerHTML = "<ul>" + lines + "</ul>";
  }
}

function applyStock(names) {
  soldOut = {};
  names.forEach(function (n) { soldOut[n] = true; });
  var removed = [];
  ALL.forEach(function (i) {
    if (soldOut[i.name] && qty[i.id]) { removed.push(i.name); delete qty[i.id]; }
  });
  update();
  if (removed.length) showPop({ title: "有品項剛賣完了", text: removed.join("、") + " 已從你的訂單移除" });
}
function pollStock() {
  if (!STOCK_TOPIC || !window.fetch) return;
  fetch("https://ntfy.sh/" + STOCK_TOPIC + "/json?poll=1&since=12h", { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var last = null;
      t.split("\n").forEach(function (l) {
        try { var m = JSON.parse(l); if (m.event === "message") last = m; } catch (e) {}
      });
      if (!last) return;
      var d = JSON.parse(last.message);
      if (d && Array.isArray(d.out)) applyStock(d.out);
      if (d && d.prices && typeof d.prices === "object") {
        try { localStorage.setItem(PRICE_KEY, JSON.stringify(d.prices)); } catch (e) {}
        applyPrices(d.prices);
      }
    })
    .catch(function () {});
}

function applyPrices(map) {
  if (!map || typeof map !== "object") return;
  var changed = false;
  ALL.forEach(function (i) {
    var p = map[i.name];
    if (typeof p === "number" && p >= 0 && p <= 99999 && p !== i.price) {
      i.price = p; changed = true;
      var el = document.querySelector("#row-" + i.id + " .price");
      if (el) el.textContent = money(p) + "／" + i.unit;
    }
  });
  if (changed) update();
}

var APPS = ["台灣Pay","歐付寶","橘子支付","全盈+PAY","全支付","icash Pay","街口","玉山Wallet","ezPay","悠遊付"];
var PAY_NAMES = { cash: "現場付現", linepay: "LINE Pay", ipass: "一卡通", twqr: "TWQR" };
var payKey = "";
function renderPay() {
  var els = document.querySelectorAll("#pgrid .po");
  for (var i = 0; i < els.length; i++) els[i].classList.toggle("sel", els[i].getAttribute("data-k") === payKey);
  var box = document.getElementById("payPanel");
  if (!payKey) { box.hidden = true; box.innerHTML = ""; return; }
  var t = total(), amt = money(t), h = "";
  if (payKey === "cash") {
    h = '<h3>💵 取餐時現場付現</h3><p class="amt">' + (t ? amt : "還沒點餐") + "</p>";
  } else {
    h = "<h3>💳 線上付款：" + PAY_NAMES[payKey] + "</h3>";
    h += t ? '<p class="amt">請付 ' + amt + "</p>" : '<p class="hint">還沒點餐，選好餐點後這裡會顯示要付的金額。</p>';
    if (payKey === "linepay") {
      h += '<a class="paybtn" href="' + LINE_URL + '" target="_blank" rel="noopener noreferrer">開啟 LINE Pay 付款</a>' +
           '<p class="hint">按鈕沒反應？請用另一支手機掃下面的 QR，或截圖後在 App 選「相簿掃描」。</p>' +
           '<img class="qrimg" src="' + QR_LINE + '" alt="LINE Pay 付款 QR Code">';
    } else {
      var who = payKey === "ipass" ? "一卡通 MONEY" : "你的支付 App（" + APPS.join("、") + " 都能掃）";
      h += '<p class="hint">請用「' + who + '」掃描下面的 TWQR（台灣通用 QR）。用同一支手機掃不了的話，請截圖後在 App 選「相簿掃描」。</p>' +
           '<img class="qrimg" src="' + QR_TWQR + '" alt="TWQR 付款 QR Code">';
    }
    h += '<ol class="steps"><li>開啟或掃描付款碼</li><li>輸入金額' + (t ? " <b>" + amt + "</b>" : "") + '（這個碼不會自動帶入金額）</li><li>付款成功後，請給老闆看付款成功畫面</li></ol>';
    if (t) h += '<button type="button" id="copyAmt">複製金額 ' + t + "</button>";
  }
  box.innerHTML = h; box.hidden = false;
}
document.getElementById("pgrid").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-k]");
  if (!b) return;
  var k = b.getAttribute("data-k");
  payKey = payKey === k ? "" : k;
  renderPay();
  if (payKey) { try { document.getElementById("payPanel").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (x) {} }
});
document.getElementById("payPanel").addEventListener("click", function (e) {
  var b = e.target.closest("#copyAmt");
  if (!b) return;
  var t = total();
  var ok = function () { b.textContent = "已複製 " + t; };
  try { navigator.clipboard.writeText(String(t)).then(ok, function () { b.textContent = "請記下金額 " + t; }); }
  catch (x) { b.textContent = "請記下金額 " + t; }
});
var _updateBase = update;
update = function () { _updateBase(); renderPay(); };
pollStock();
setInterval(pollStock, 45000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) pollStock(); });

update();
</script>
