<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>張記黃牛肉 · 線上點餐</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6efe2;--card:#fffaf0;--ink:#241a14;--mut:#7a6a5c;--line:#e3d6bf;--gold:#a87b1f;--red:#a8231b;--on-red:#fff;--bar:#241a14;--on-bar:#f6efe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110e;--card:#241b16;--ink:#f3e9d6;--mut:#a89885;--line:#3b2e25;--gold:#d8b25a;--red:#c63a2f;--bar:#0e0a08;--on-bar:#f3e9d6}}
:root[data-theme="dark"]{--bg:#17110e;--card:#241b16;--ink:#f3e9d6;--mut:#a89885;--line:#3b2e25;--gold:#d8b25a;--red:#c63a2f;--bar:#0e0a08;--on-bar:#f3e9d6}
*{box-sizing:border-box}html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:96px}
header{background:#1c1a1a;color:#f3e9d6;padding:0 0 10px;text-align:center;border-bottom:3px solid var(--gold)}
header img{display:block;width:100%;max-width:640px;margin:0 auto;height:auto}
header h1{margin:0;font-size:24px;letter-spacing:.2em;font-family:"Noto Serif TC","Songti TC",serif}
header h1 span{color:var(--gold)}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
.mode{display:flex;gap:8px;padding:12px 16px 0;max-width:640px;margin:auto}
.mode button{flex:1;padding:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:700}
.mode button.on{background:var(--red);color:var(--on-red);border-color:var(--red)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
.tabs a{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
main{max-width:640px;margin:auto;padding:0 16px}
h2{margin:22px 0 4px;font-size:19px;font-family:"Noto Serif TC","Songti TC",serif;color:var(--red);border-left:5px solid var(--gold);padding-left:10px}
.note{font-size:12px;color:var(--mut);margin:0 0 6px 15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.row b{display:block;font-weight:600}.row small{color:var(--gold);font-weight:700}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--red);background:transparent;color:var(--red);font-size:20px;line-height:1;font-weight:700}
.step button.p{background:var(--red);color:var(--on-red)}
.step span{min-width:20px;text-align:center;font-weight:700}
.row.has{border-color:var(--red)}
footer{max-width:640px;margin:28px auto 0;padding:0 16px;color:var(--mut);font-size:13px;text-align:center}
footer a{color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--on-bar);display:flex;align-items:center;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:9}
.bar .t{font-size:13px;opacity:.85}.bar .t b{display:block;font-size:22px;color:var(--gold)}
.btn{background:var(--red);color:var(--on-red);border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px}
.btn:disabled{opacity:.45}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 10px;font-size:20px}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:12px 0;color:var(--red)}
input,textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font:inherit;width:100%;margin-top:8px}
.ticket{text-align:center}.ticket .no{font-size:44px;font-weight:800;color:var(--red);letter-spacing:.1em}
.oc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.oc.new{border-color:var(--red)}.oc.done{opacity:.55}
.oc h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:18px}
.tag{font-size:12px;background:var(--red);color:var(--on-red);padding:2px 8px;border-radius:999px}
.hide{display:none!important}

.ptabs{display:flex;gap:6px;padding:12px 16px 0;max-width:640px;margin:auto}
.ptabs button{flex:1;padding:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:700}
.ptabs button.on{background:var(--red);color:var(--on-red);border-color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.chips button{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;font-weight:600}
.chips button.on{background:var(--gold);color:#1c1a1a;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.tile{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:70px;user-select:none;-webkit-user-select:none}
.tile b{display:block;font-weight:600;font-size:15px}.tile small{color:var(--gold);font-weight:700}
.tile i{position:absolute;top:-7px;right:-5px;background:var(--red);color:var(--on-red);border-radius:999px;min-width:26px;height:26px;padding:0 6px;font-style:normal;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile .mn{position:absolute;right:8px;bottom:6px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);text-align:center;line-height:26px;font-size:20px;font-weight:700}
.tile:has(i){border-color:var(--red)}
.sm{padding:6px 14px!important;font-size:15px!important}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qk button{flex:1;padding:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}
.stat b{display:block;font-size:20px;color:var(--red)}
.pend{display:inline-block;background:var(--gold);color:#1c1a1a;border-radius:999px;font-size:12px;padding:0 7px;margin-left:4px;font-style:normal}
</style>
</head>

{c:"切類",i:[["牛心","",130],["牛肝","",130],["牛筋","",130],["牛腱","",130],["牛肚","",130],["牛舌","",160],["肉腸","",160],["牛腳蹄","",200],["和風牛肉","",130]]},
{c:"炒類",i:[["炒青菜","",60],["炒牛肉時蔬","",180],["炒牛雜","",180],["椒鹽牛肉","",180],["咖哩牛肉","",180],["炒骨仔肉","",180],["蔥爆牛肉","",180],["牛肉香腸","",180],["薑絲炒牛雜","",180],["叉燒肉角","",480],["三杯牛尾","",580],["牛肉壽喜燒","",480],["黑胡椒牛柳","",380]]},
{c:"湯類",i:[["牛雜湯","",100],["牛肉清湯","",100],["花肉湯","",130],["清燉肉角湯","",130],["骨仔肉湯","",100]]},
{c:"飯麵類",i:[["招牌肉筋飯","",70],["白飯","",10],["牛肉炒麵","",110]]},
{c:"預約",n:"預約品項請提前來電確認",i:[["牛鞭牛尾燉烏骨雞（10人份）","",4500],["滴牛肉精力湯","時價",0],["手工辣椒醬","大",350],["手工辣椒醬","小",190],["自製牛肉香腸（一斤）","",480]]}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const cart={};let mode="內用";
const key=(ci,ii)=>ci+"-"+ii;
const item=k=>{const[c,i]=k.split("-");const it=MENU[c].i[i];return{n:it[0]+(it[1]&&it[1]!=="時價"?"（"+it[1]+"）":""),p:it[2],tag:it[1]==="時價"?"時價":""}};

function build(){
  $("#tabs").innerHTML=MENU.map((m,ci)=>`<a href="#c${ci}">${m.c}</a>`).join("");
  $("#menu").innerHTML=MENU.map((m,ci)=>`<h2 id="c${ci}">${m.c}</h2>${m.n?`<p class="note">${m.n}</p>`:""}`+m.i.map((it,ii)=>{
    const k=key(ci,ii),o=item(k);
    return `<div class="row" id="r${k}"><div><b>${esc(o.n)}</b><small>${o.tag||"NT$ "+o.p}</small></div><div class="step"><button data-k="${k}" data-d="-1" class="hide">−</button><span class="hide" id="q${k}">0</span><button class="p" data-k="${k}" data-d="1">+</button></div></div>`}).join("")).join("");
}
function sync(){
  let n=0,t=0;
  for(const k in cart){if(cart[k]>0){n+=cart[k];t+=item(k).p*cart[k]}}
  document.querySelectorAll(".row").forEach(r=>{
    const k=r.id.slice(1),q=cart[k]||0;
    r.classList.toggle("has",q>0);
    r.querySelector("button[data-d='-1']").classList.toggle("hide",!q);
    const s=document.getElementById("q"+k);s.classList.toggle("hide",!q);s.textContent=q;
  });
  $("#cnt").textContent=n?`共 ${n} 項`:"未選餐點";
  $("#sum").textContent="NT$ "+t.toLocaleString();
  $("#go").disabled=!n;
  return{n,t};
}
$("#menu").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+ +b.dataset.d);sync();
});
$("#mIn").onclick=()=>{mode="內用";$("#mIn").classList.add("on");$("#mOut").classList.remove("on")};
$("#mOut").onclick=()=>{mode="外帶";$("#mOut").classList.add("on");$("#mIn").classList.remove("on")};

const tableFromUrl=new URLSearchParams(location.search).get("t")||"";
function lines(){return Object.keys(cart).filter(k=>cart[k]>0).map(k=>{const o=item(k);return{n:o.n,p:o.p,q:cart[k],tag:o.tag}})}
function open(h){$("#panel").innerHTML=h;$("#sheet").classList.add("show")}
function close(){$("#sheet").classList.remove("show")}

$("#go").onclick=()=>{
  const{t}=sync(),L=lines(),hasMarket=L.some(x=>x.tag);
  open(`<h3>確認訂單（${mode}）</h3>`+L.map(x=>`<div class="line"><span>${esc(x.n)} × ${x.q}</span><span>${x.tag||"NT$ "+(x.p*x.q).toLocaleString()}</span></div>`).join("")+
  `<div class="tot"><span>合計</span><span>NT$ ${t.toLocaleString()}</span></div>${hasMarket?'<p class="note">含時價品項，金額由店家現場告知。</p>':""}`+
  (mode==="內用"?`<label>桌號</label><input id="tb" inputmode="numeric" placeholder="例如 5" value="${esc(tableFromUrl)}">`:"")+
  `<label>備註（選填，例如：不要香菜）</label><textarea id="nt" rows="2"></textarea>
  <button class="btn" style="width:100%" id="send">確認送出</button><button class="ghost" id="back">回去修改</button><p class="note" id="err" style="color:var(--red)"></p>`);
  $("#back").onclick=close;
  $("#send").onclick=submit;
};

async function getDb(){try{return await window.claude?.use("db")}catch(e){return null}}
async function submit(){
  const tb=$("#tb")?$("#tb").value.trim():"";
  if(mode==="內用"&&!tb){$("#err").textContent="請填桌號";return}
  const L=lines(),t=L.reduce((a,x)=>a+x.p*x.q,0);
  const no=String(Math.floor(Math.random()*900)+100);
  const order={no,table:tb,mode,items:L,total:t,note:$("#nt").value.trim().slice(0,100),ts:Date.now(),done:false};
  $("#send").disabled=true;
  let sent=false;
  try{const db=await getDb();if(db){await db.collection("orders").add(order);sent=true}}catch(e){}
  for(const k in cart)delete cart[k];sync();
  open(`<div class="ticket"><h3>${sent?"已送出，請稍候 🙏":"請將此畫面給店家"}</h3><div class="no">#${no}</div><p>${mode==="內用"?"桌號 "+esc(tb):"外帶"} · 合計 NT$ ${t.toLocaleString()}</p>`+
  L.map(x=>`<div class="line"><span>${esc(x.n)}</span><span>× ${x.q}</span></div>`).join("")+
  (sent?"":`<p class="note">目前無法連線到店家，請直接出示此畫面點餐。</p>`)+`<button class="ghost" id="ok">完成</button></div>`);
  $("#ok").onclick=close;
}

/* 店家頁 */
let unsub=null,first=true;
async function shopInit(){
  const db=await getDb();
  if(!db){$("#shopState").textContent="尚未連線（需要在已授權的環境開啟）";return}
  $("#shopState").textContent="即時接單中 · 新單會自動出現";
  if(unsub)unsub();
  unsub=db.collection("orders").orderBy("ts","desc").limit(60).onSnapshot(s=>{
    const fresh=!first&&s.docChanges().some(c=>c.type==="added");first=false;
    if(fresh&&navigator.vibrate)navigator.vibrate(300);
    $("#orders").innerHTML=s.docs.map((d,i)=>{const o=d.data();
      return `<div class="oc ${o.done?"done":(fresh&&i===0?"new":"")}"><h4><span>${o.mode==="內用"?"桌 "+esc(o.table):"外帶"} · #${esc(o.no)}</span><span>${new Date(o.ts).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}</span></h4>`+
      (o.items||[]).map(x=>`<div class="line"><span>${esc(x.n)}</span><span>× ${x.q}</span></div>`).join("")+
      (o.note?`<p>📝 ${esc(o.note)}</p>`:"")+
      `<div class="tot"><span>NT$ ${Number(o.total).toLocaleString()}</span><button class="btn" style="padding:6px 14px;font-size:15px" data-id="${d.id}" data-done="${o.done?0:1}">${o.done?"取消完成":"完成"}</button></div></div>`}).join("")||"<p class='note'>目前沒有訂單</p>";
  });
}
$("#orders").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  const db=await getDb();if(db)await db.doc("orders/"+b.dataset.id).update({done:b.dataset.done==="1"});
});
function route(){
  const h=location.hash,sh=h==="#shop",po=h==="#pos";
  $("#cust").classList.toggle("hide",sh||po);$("#shop").classList.toggle("hide",!sh);$("#pos").classList.toggle("hide",!po);
  if(sh)shopInit();if(po)posInit();
}
addEventListener("hashchange",route);

/* ===== 收銀記帳 ===== */
let pcart={},pmode="內用",pcat=0,pOid=null,PDB=null,pSales=[],pOrders=[],pInited=false;
const pQty=()=>Object.values(pcart).reduce((a,b)=>a+b,0);
const pSum=()=>Object.keys(pcart).reduce((a,k)=>a+item(k).p*pcart[k],0);
const num=v=>Math.max(0,parseInt(v)||0);
const dstr=ts=>{const x=new Date(ts);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const hhmm=ts=>new Date(ts).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
const keyByName=n=>{for(let c=0;c<MENU.length;c++)for(let i=0;i<MENU[c].i.length;i++)if(item(c+"-"+i).n===n)return c+"-"+i;return null};
function pTiles(){
  $("#pchips").innerHTML=MENU.map((m,ci)=>`<button data-c="${ci}" class="${ci===pcat?"on":""}">${m.c}</button>`).join("");
  $("#ptiles").innerHTML=MENU[pcat].i.map((_,ii)=>{const k=pcat+"-"+ii,o=item(k),q=pcart[k]||0;
    return `<div class="tile" data-k="${k}"><b>${esc(o.n)}</b><small>${o.tag||"NT$ "+o.p}</small>${q?`<i>${q}</i><span class="mn">−</span>`:""}</div>`}).join("");
  const n=pQty();$("#pcnt").textContent=`共 ${n} 份`;$("#psum").textContent="NT$ "+pSum().toLocaleString();$("#pgo").disabled=!n;
}
function pSetMode(m){pmode=m;$("#pIn").classList.toggle("on",m==="內用");$("#pOut").classList.toggle("on",m==="外帶")}
function pTab(t){
  document.querySelectorAll(".ptabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["pos","ord","led"].forEach(x=>$("#p-"+x).classList.toggle("hide",x!==t));
  $("#pbar").classList.toggle("hide",t!=="pos");
}
function pOrd(){
  const L=pOrders.filter(o=>!o.d.done);
  const b=$("#pbadge");b.textContent=L.length;b.classList.toggle("hide",!L.length);
  $("#p-ord").innerHTML=!PDB?'<p class="note">需連線才能接收線上訂單。</p>':(L.map(o=>{const d=o.d;
    return `<div class="oc new"><h4><span>${d.mode==="內用"?"桌 "+esc(d.table):"外帶"} · #${esc(d.no)}</span><span>${hhmm(d.ts)}</span></h4>`+
    (d.items||[]).map(x=>`<div class="line"><span>${esc(x.n)}</span><span>× ${x.q}</span></div>`).join("")+(d.note?`<p>📝 ${esc(d.note)}</p>`:"")+
    `<div class="tot"><span>NT$ ${Number(d.total).toLocaleString()}</span><button class="btn sm" data-load="${o.id}">帶入收銀</button></div></div>`}).join("")||'<p class="note">目前沒有待處理的線上訂單</p>');
}
function pLed(){
  const day=$("#pdate").value||dstr(Date.now());
  const A=pSales.filter(x=>dstr(x.d.ts)===day);
  const tot=A.reduce((a,x)=>a+x.d.total,0),cnt={};
  A.forEach(x=>x.d.items.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("#pledbody").innerHTML=`<div class="stat"><div><b>NT$ ${tot.toLocaleString()}</b>營業額</div><div><b>${A.length}</b>筆數</div><div><b>${A.length?Math.round(tot/A.length):0}</b>平均客單</div></div>`+
   (top.length?`<h2>熱賣前五</h2>`+top.map(t=>`<div class="line"><span>${esc(t[0])}</span><span>${t[1]} 份</span></div>`).join(""):"")+
   `<h2>明細</h2>`+(A.map(x=>{const d=x.d;
    return `<div class="oc"><h4><span>${hhmm(d.ts)} · ${d.mode==="內用"&&d.table?"桌 "+esc(d.table):esc(d.mode)}${d.src==="online"?' <span class="tag">線上</span>':""}</span><span>NT$ ${d.total.toLocaleString()}</span></h4><div class="note" style="margin:0">${d.items.map(i=>esc(i.n)+"×"+i.q).join("、")}${d.extra?"、加收 "+d.extra:""}</div><button class="ghost" style="padding:6px;margin-top:6px" data-del="${x.id}">刪除這筆</button></div>`}).join("")||'<p class="note">這天沒有紀錄</p>');
}
async function saveSale(sale){
  if(PDB){await PDB.collection("sales").add(sale)}
  else{try{const a=JSON.parse(localStorage.getItem("sales")||"[]");a.push(sale);localStorage.setItem("sales",JSON.stringify(a))}catch(e){}pSales.unshift({id:"l"+sale.ts,d:sale});pLed()}
}
function pCheckout(){
  const L=Object.keys(pcart).filter(k=>pcart[k]>0).map(k=>({...item(k),q:pcart[k]})),base=pSum(),tb=$("#ptb").value.trim();
  open(`<h3>結帳（${pmode}${tb?" · 桌 "+esc(tb):""}）</h3>`+L.map(x=>`<div class="line"><span>${esc(x.n)} × ${x.q}</span><span>${x.tag||"NT$ "+(x.p*x.q).toLocaleString()}</span></div>`).join("")+
  `<label style="display:block;margin-top:8px">其他加收（時價品項等，選填）</label><input id="pex" inputmode="numeric" placeholder="0">
  <div class="tot"><span>應收</span><span id="ptot">NT$ ${base.toLocaleString()}</span></div>
  <label>實收</label><input id="ppd" inputmode="numeric" placeholder="輸入客人給的金額">
  <div class="qk"><button data-v="x">剛好</button><button data-v="100">100</button><button data-v="500">500</button><button data-v="1000">1000</button></div>
  <p class="note" id="pchg" style="font-size:16px;margin-left:0"></p><button class="btn" style="width:100%" id="pok">確認收款</button><button class="ghost" id="pcl">返回</button>`);
  const calc=()=>{const t=base+num($("#pex").value),p=num($("#ppd").value);$("#ptot").textContent="NT$ "+t.toLocaleString();
    $("#pchg").textContent=!$("#ppd").value?"":p>=t?"找零 NT$ "+(p-t).toLocaleString():"尚差 NT$ "+(t-p).toLocaleString();return{t,p}};
  $("#pex").oninput=calc;$("#ppd").oninput=calc;
  $("#panel").onclick=e=>{const b=e.target.closest(".qk button");if(!b)return;const t=base+num($("#pex").value);$("#ppd").value=b.dataset.v==="x"?t:b.dataset.v;calc()};
  $("#pcl").onclick=close;
  $("#pok").onclick=async()=>{
    const{t,p}=calc();if(p<t){$("#pchg").textContent="實收不足，請確認金額";return}
    $("#pok").disabled=true;
    const sale={ts:Date.now(),mode:pmode,table:tb,items:L.map(x=>({n:x.n,p:x.p,q:x.q})),extra:num($("#pex").value),total:t,paid:p,change:p-t,src:pOid?"online":"pos"};
    try{await saveSale(sale)}catch(e){$("#pchg").textContent="記帳失敗，請再試一次";$("#pok").disabled=false;return}
    if(pOid&&PDB){try{await PDB.doc("orders/"+pOid).update({done:true})}catch(e){}}
    $("#panel").onclick=null;
    open(`<div class="ticket"><h3>找零</h3><div class="no">NT$ ${(p-t).toLocaleString()}</div><p>應收 ${t.toLocaleString()} · 實收 ${p.toLocaleString()}</p><button class="btn" style="width:100%" id="pback">返回</button></div>`);
    $("#pback").onclick=()=>{close();pcart={};pOid=null;$("#ptb").value="";pTiles()};
  };
}
async function posInit(){
  if(pInited)return;pInited=true;
  PDB=await getDb();
  let u=null;try{u=await window.claude?.use("user")}catch(e){}
  if(PDB&&u&&!u.canEdit()){$("#pos").innerHTML='<main><h2>收銀系統</h2><p class="note">此頁僅限店主使用。</p></main>';return}
  $("#pdate").value=dstr(Date.now());
  if(PDB){
    PDB.collection("sales").orderBy("ts","desc").limit(1000).onSnapshot(sn=>{pSales=sn.docs.map(d=>({id:d.id,d:d.data()}));pLed()},()=>{});
    PDB.collection("orders").orderBy("ts","desc").limit(60).onSnapshot(sn=>{pOrders=sn.docs.map(d=>({id:d.id,d:d.data()}));pOrd()},()=>{});
  }else{
    try{pSales=JSON.parse(localStorage.getItem("sales")||"[]").map(d=>({id:"l"+d.ts,d})).reverse()}catch(e){}
    pOrd();
  }
  pLed();
}
document.querySelector(".ptabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)pTab(b.dataset.t)});
$("#pchips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){pcat=+b.dataset.c;pTiles()}});
$("#ptiles").addEventListener("click",e=>{const t=e.target.closest(".tile");if(!t)return;const k=t.dataset.k;
  pcart[k]=e.target.closest(".mn")?Math.max(0,(pcart[k]||0)-1):(pcart[k]||0)+1;pTiles()});
$("#pIn").onclick=()=>pSetMode("內用");$("#pOut").onclick=()=>pSetMode("外帶");
$("#pclr").onclick=()=>{pcart={};pOid=null;pTiles()};
$("#pgo").onclick=pCheckout;
$("#pdate").onchange=pLed;
$("#p-ord").addEventListener("click",e=>{const b=e.target.closest("[data-load]");if(!b)return;
  const o=pOrders.find(x=>x.id===b.dataset.load);if(!o)return;
  pcart={};(o.d.items||[]).forEach(x=>{const k=keyByName(x.n);if(k)pcart[k]=(pcart[k]||0)+x.q});
  pSetMode(o.d.mode);$("#ptb").value=o.d.table||"";pOid=o.id;pTiles();pTab("pos")});
$("#pledbody").addEventListener("click",async e=>{const b=e.target.closest("[data-del]");if(!b)return;
  if(!b.dataset.arm){b.dataset.arm="1";b.textContent="再按一次確定刪除";return}
  const id=b.dataset.del;
  if(PDB){try{await PDB.doc("sales/"+id).delete()}catch(e){}}
  else{pSales=pSales.filter(x=>x.id!==id);try{localStorage.setItem("sales",JSON.stringify(pSales.map(x=>x.d).reverse()))}catch(e){}pLed()}});
pTiles();

build();sync();route();
</script>
</body>
