const shrine=canvasMat(300,300,(g)=>{g.fillStyle='#6b201e';g.fillRect(0,0,300,300);g.strokeStyle='#e5bd65';g.lineWidth=10;g.strokeRect(12,12,276,276);g.fillStyle='#f4d18a';g.font='bold 65px serif';g.textAlign='center';g.fillText('福',150,190)});
const sh=new THREE.Mesh(new THREE.PlaneGeometry(.9,.9),shrine);sh.position.set(2.65,1.72,-12.22);scene.add(sh);for(let x of [2.2,3.1]){const bulb=addSphere(.08,x,1.15,-12.35,mat(0xff3322));warm(x,1.2,-12.2,.18)}
addBox(.85,1.25,.65,1.15,.63,-12.2,mat(0xe6e8e8));addBox(.68,.07,.05,1.15,.85,-11.86,mat(0x9ba3a8));
// 吊扇與日光燈
function fan(x,z){addCyl(.13,.13,.12,x,3.42,z,MATS.steelDark);addCyl(.055,.055,.4,x,3.18,z,MATS.steelDark);const hub=addCyl(.18,.18,.1,x,2.96,z,MATS.steel);for(let i=0;i<4;i++){const a=i*Math.PI/2;const blade=addBox(.95,.035,.22,x+Math.cos(a)*.48,2.96,z+Math.sin(a)*.48,mat(0x9d8a79));blade.rotation.y=-a;}return hub}
const fans=[fan(-3.8,-4.3),fan(2.2,-8.2)];
for(let z of [-10,-6,-2]){addBox(2.1,.06,.18,0,3.39,z,MATS.white);addBox(1.85,.025,.12,0,3.34,z,mat(0xfff4cf));warm(0,3.1,z,.22)}
// 瓦斯桶與門口小物
addCyl(.27,.3,.78,-5.55,.42,2.35,mat(0x3c9a61));addCyl(.07,.07,.16,-5.55,.88,2.35,MATS.steel);addBox(.38,.12,.3,-5.3,.1,1.95,MATS.dark);
// 人物：有頭、身體、手腳關節，走路時會擺動
function makePerson(shirt,pants,apron=false){const g=new THREE.Group();const torso=addBox(.42,.62,.25,0,1.12,0,mat(shirt),g);const hip=addBox(.34,.2,.23,0,.72,0,mat(pants),g);const head=addSphere(.22,0,1.62,0,mat(0xe9bd99),g);const hair=addSphere(.225,0,1.76,-.015,mat(0x33251f),g);hair.scale.set(1,.52,1);const arms=[];for(let s of [-1,1]){const a=new THREE.Group();a.position.set(s*.26,1.32,0);g.add(a);addBox(.13,.48,.14,0,-.2,0,mat(shirt),a);addSphere(.075,0,-.46,.02,mat(0xe9bd99),a);arms.push(a)}const legs=[];for(let s of [-1,1]){const l=new THREE.Group();l.position.set(s*.12,.66,0);g.add(l);addBox(.14,.48,.16,0,-.23,0,mat(pants),l);addBox(.19,.1,.28,0,-.48,.055,mat(0x29262a),l);legs.push(l)}if(apron){const ap=addBox(.34,.43,.035,0,1.02,.145,mat(0x3b3430),g)}g.userData={arms,legs};return g}
const player=makePerson(0xc7a33f,0x292a30,true);player.position.set(0,0,4.7);scene.add(player);
const cook=makePerson(0xf0eee8,0x333b43,true);cook.position.set(-3.5,0,-9.25);cook.rotation.y=Math.PI;scene.add(cook);
const guest1=makePerson(0x52718c,0x33313a);guest1.position.set(-3.8,0,-4.0);guest1.rotation.y=.4;scene.add(guest1);
const guest2=makePerson(0x9d5360,0x29272c);guest2.position.set(0,0,-6.8);guest2.rotation.y=Math.PI;scene.add(guest2);
// 碰撞範圍：桌子與大型設備，保持中間走道通暢
const obstacles=[[-3.8,-3.2,.95,.85],[-3.8,-6.2,.95,.85],[-3.8,-9.3,.95,.85],[0,-6,1,.75],[2.4,-9.2,.95,.8],[-3.65,2.65,1.9,.8],[-5,1.1,.8,.65],[4.55,-12.15,.75,.55]];
function canMove(x,z){if(x<-5.45||x>5.45||z<-12.55||z>6.1)return false;for(const [ox,oz,rx,rz] of obstacles){if(Math.abs(x-ox)<rx&&Math.abs(z-oz)<rz)return false}return true}
// 外部路面、騎樓地面延伸
plane(28,20,0,-.18,7,mat(0x444247));for(let i=-4;i<=4;i++)addBox(.035,.01,5,i*2,-.165,7,mat(0x77716b));
// 操作：左下虛擬搖桿 + 畫面拖曳，鍵盤也可用
const pad=document.createElement('div');pad.id='joy';pad.innerHTML='<div id="joybase"><div id="joyknob"></div></div><div id="joylabel">移動</div>';$('#st').appendChild(pad);
const style=document.createElement('style');style.textContent=`#joy{position:absolute;z-index:5;left:18px;bottom:22px;width:116px;height:116px;pointer-events:none;opacity:.86}#joybase{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#ffffff22,#0008);border:2px solid #ffffff66;box-shadow:0 4px 18px #0008}#joyknob{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:linear-gradient(145deg,#fff2ce,#c99a55);border:2px solid #fff9;box-shadow:0 3px 10px #0008}#joylabel{position:absolute;bottom:-19px;width:100%;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 4px #000}#near{bottom:26px;left:50%;padding:14px 22px;font-size:18px}#hint{font-size:14px;background:#100e0dd9}`;document.head.appendChild(style);
let joy={x:0,y:0,active:false,id:null};const base=$('#joybase'),knob=$('#joyknob');
function joySet(e){const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),max=34;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
base.addEventListener('pointerdown',e=>{e.preventDefault();joy.active=true;joy.id=e.pointerId;base.setPointerCapture(e.pointerId);joySet(e)});base.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)joySet(e)});function joyEnd(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}base.addEventListener('pointerup',joyEnd);base.addEventListener('pointercancel',joyEnd);
let drag=null;cv.addEventListener('pointerdown',e=>{if(e.clientX<155&&e.clientY>window.innerHeight-165)return;drag={x:e.clientX,y:e.clientY,dx:0,dy:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}});cv.addEventListener('pointermove',e=>{if(!drag)return;drag.dx=Math.max(-1,Math.min(1,(e.clientX-drag.x)/38));drag.dy=Math.max(-1,Math.min(1,(e.clientY-drag.y)/38))});const endDrag=()=>drag=null;cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let hintTimer;function say(t,ms=5200){$('#hint').textContent=t;$('#hint').style.display='block';clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('#hint').style.display='none',ms)}
say('歡迎來到張記黃牛肉！左下搖桿移動，走到櫃檯按「看菜單」',8500);
let last=performance.now(),elapsed=0,camX=0,camZ=11.5,near=false,entered=false;
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.045);last=now;elapsed+=dt;
 let dx=joy.x,dz=joy.y;if(drag){dx=drag.dx;dz=drag.dy}if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;
 let moving=false;if(!open){const len=Math.hypot(dx,dz);if(len>.12){dx/=Math.max(1,len);dz/=Math.max(1,len);const nx=player.position.x+dx*3.15*dt,nz=player.position.z+dz*3.15*dt;if(canMove(nx,player.position.z))player.position.x=nx;if(canMove(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(dx,dz);moving=true}}
 player.userData.legs.forEach((l,i)=>{l.rotation.x=moving?Math.sin(elapsed*10+i*Math.PI)*.55:Math.sin(elapsed*1.8+i)*.025});player.userData.arms.forEach((a,i)=>{a.rotation.x=moving?Math.sin(elapsed*10+i*Math.PI+Math.PI)*.35:Math.sin(elapsed*1.6+i)*.025});
 fans.forEach((f,i)=>{f.rotation.y=elapsed*(i?1.5:2.1)});
 const inside=player.position.z<1.0;if(inside&&!entered){entered=true;say('老闆：歡迎光臨！菜單就在右手邊，櫃檯也可以點餐。',6500)}
 const d=Math.hypot(player.position.x-3.8,player.position.z+2.0);near=d<3.0&&!open;$('#near').style.display=near?'block':'none';
 const targetX=player.position.x*.65,targetZ=player.position.z+6.8;const k=1-Math.exp(-dt*3.8);camX+=(targetX-camX)*k;camZ+=(targetZ-camZ)*k;
 camera.position.set(camX,5.2,camZ);camera.lookAt(player.position.x,.95,player.position.z-2.1);
 renderer.render(scene,camera);
}
function resize(){const el=$('#st');renderer.setSize(el.clientWidth,el.clientHeight,false);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();requestAnimationFrame(animate);
